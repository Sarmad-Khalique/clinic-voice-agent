[project]
name = "clinic-agent"
version = "0.1.0"
description = "LiveKit voice agent for the clinic receptionist"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "livekit-agents[deepgram,silero,turn-detector]>=1.9.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "clinic_agent"
module-root = ""
