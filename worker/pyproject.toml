[project]
name = "clinic-worker"
version = "0.1.0"
description = "Celery worker for post-call jobs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.7.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "clinic_worker"
module-root = ""
